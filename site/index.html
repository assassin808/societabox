<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YAX</title>
<meta name="description" content="YAX calibrates AI agents to behave like humans.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500,100;9..144,700,100;9..144,900,100&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: a toy shelf under a cloud-wallpaper sky. The cast stands still like toys until you look closer: they blink, breathe, hop. Then the award, the film, the founders. One deliberate light look. */
:root{
  --sky-top:#6fb4e6; --sky-low:#cfe7f7; --cloud:#ffffff; --cloud-shade:#d8e9f6;
  --night:#13243a; --ink:#1b2735; --muted:#566374; --paper:#fbf8f2; --line:#e7e0d3;
  --wood:#c98a4b; --wood-dark:#8e5a2c; --gold:#e8b23a; --gold-dark:#b9861d; --red:#d64a3a; --blue:#3d7fb3;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 18px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:6px}
.display{font-family:var(--display);font-variation-settings:"SOFT" 100;letter-spacing:-.01em}

/* sky */
.sky{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--sky-top) 0%,#a6d3f1 55%,var(--sky-low) 100%);padding-inline:20px}
.clouds{position:absolute;inset:0;pointer-events:none}
@media (max-width:640px){.clouds{top:40px}}
.cloud{position:absolute;height:var(--h);width:calc(var(--h) * 2.6);background:var(--cloud);border-radius:999px;box-shadow:inset 0 calc(var(--h) * -.18) 0 var(--cloud-shade);animation:drift var(--t) linear infinite;animation-delay:var(--d)}
.cloud::before,.cloud::after{content:"";position:absolute;background:var(--cloud);border-radius:50%}
.cloud::before{width:calc(var(--h) * 1.1);height:calc(var(--h) * 1.1);left:calc(var(--h) * .35);top:calc(var(--h) * -.55)}
.cloud::after{width:calc(var(--h) * 1.35);height:calc(var(--h) * 1.35);left:calc(var(--h) * 1.05);top:calc(var(--h) * -.8)}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}

.bar{position:relative;display:flex;justify-content:space-between;align-items:center;max-width:1120px;margin-inline:auto;padding-block:22px}
.logo{display:flex;gap:5px;text-decoration:none}
.logo span{display:grid;place-items:center;width:34px;height:38px;font:800 23px/1 var(--display);color:#fff;border-radius:4px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.logo span:nth-child(1){background:var(--red);transform:rotate(-4deg)}
.logo span:nth-child(2){background:var(--gold);color:var(--night);transform:rotate(3deg)}
.logo span:nth-child(3){background:var(--blue);transform:rotate(-2deg);font-style:italic}
.bar a.contact{font:700 15px var(--body);color:var(--night);text-decoration:none;background:rgba(255,255,255,.75);padding:10px 16px;border-radius:999px}
.bar a.contact:hover{background:#fff}

.hero{position:relative;max-width:1120px;margin-inline:auto;text-align:center;padding-block:72px 0}
.hero h1{margin:0 auto;font-weight:900;font-size:clamp(44px,7.4vw,96px);line-height:1.02;color:var(--night);max-width:11.5em;text-wrap:balance}
.hero h1 em{font-style:normal;color:#fff;text-shadow:0 3px 0 rgba(19,36,58,.3)}

/* the shelf */
.shelf{position:relative;margin:72px auto 0;max-width:980px}
.cast{display:flex;justify-content:center;align-items:flex-end;gap:clamp(6px,2.4vw,34px);padding-inline:12px;position:relative;z-index:1}
.toy{position:relative;width:clamp(44px,8vw,96px);aspect-ratio:16/17;cursor:pointer;border:0;padding:0;background:none;animation:breathe 3.2s ease-in-out infinite;animation-delay:var(--d)}
.toy img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;filter:drop-shadow(0 6px 0 rgba(0,0,0,.12))}
.toy img.b{opacity:0;animation:blink var(--bt) steps(1) infinite;animation-delay:var(--d)}
.toy:hover,.toy:focus-visible{animation:hop .55s cubic-bezier(.3,1.6,.5,1)}
.toy.agent::after{content:"calibrated";position:absolute;left:50%;top:-34px;transform:translateX(-50%);font:700 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--night);background:var(--gold);padding:6px 8px;border-radius:999px;white-space:nowrap}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,94%{opacity:0}95%,98%{opacity:1}99%,100%{opacity:0}}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-26px) rotate(-4deg)}100%{transform:translateY(0)}}
.plank{height:26px;margin-top:-4px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#dca26a 0%,var(--wood) 45%,var(--wood-dark) 100%);box-shadow:0 18px 30px -12px rgba(60,35,10,.45)}
.plank-front{height:14px;margin:0 10px;border-radius:0 0 8px 8px;background:var(--wood-dark);opacity:.75}
.floor{height:64px}

main{padding-inline:20px}
.inner{max-width:1120px;margin-inline:auto}

/* award */
.award{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;max-width:860px;margin:96px auto 0;padding:28px 32px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 40px -28px rgba(40,30,15,.35)}
.award>*{min-width:0}
.award svg{display:block;width:84px;height:auto}
.award .label{font:800 13px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold-dark)}
.award a.title{display:block;margin-top:10px;font-weight:700;font-size:clamp(20px,2.2vw,26px);line-height:1.25;text-decoration:none;color:var(--ink)}
.award a.title:hover{color:var(--blue)}
@media (max-width:600px){.award{grid-template-columns:1fr;gap:16px;padding:24px}}

/* film */
.film{max-width:1120px;margin:64px auto 0}
.film video{display:block;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:22px;background:#000;box-shadow:0 30px 60px -30px rgba(20,30,45,.55)}

/* footer */
footer{max-width:1120px;margin:112px auto 0;padding:40px 0 56px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:24px}
.founders{font:700 20px/1.4 var(--display);font-variation-settings:"SOFT" 100}
.founders small{display:block;font:700 12px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.mail{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.addr{font:700 19px/1 var(--body);color:var(--night);text-decoration:none;user-select:all;padding:14px 20px;border-radius:999px;background:var(--gold);box-shadow:0 4px 0 var(--gold-dark)}
.addr:hover{transform:translateY(-1px)}
.copy{font:700 14px/1 var(--body);padding:14px 18px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.copy:hover{border-color:var(--ink)}
.fine{width:100%;font-size:13px;color:var(--muted);margin:0}

@media (prefers-reduced-motion: reduce){.cloud,.toy,.toy img.b{animation:none}.toy:hover{animation:none}}
</style>
</head>
<body>


<div class="sky">
  <div class="clouds" aria-hidden="true">
    <span class="cloud" style="--h:54px;--t:95s;--d:-20s;top:380px"></span>
    <span class="cloud" style="--h:38px;--t:120s;--d:-75s;top:450px"></span>
    <span class="cloud" style="--h:70px;--t:140s;--d:-100s;top:520px"></span>
    <span class="cloud" style="--h:30px;--t:110s;--d:-40s;top:14px"></span>
    <span class="cloud" style="--h:46px;--t:130s;--d:-10s;top:600px"></span>
  </div>

  <div class="bar">
    <a class="logo" href="#" aria-label="YAX"><span>Y</span><span>A</span><span>X</span></a>
    <a class="contact" href="#contact">Contact</a>
  </div>

  <div class="hero">
    <h1 class="display">We calibrate AI agents to <em>behave like humans.</em></h1>

    <div class="shelf">
      <div class="cast">
        <button class="toy" type="button" aria-label="Mei" style="--d:-.2s;--bt:5.1s"><img src="assets/cast/mei.png" alt=""><img class="b" src="assets/cast/mei_blink.png" alt=""></button>
        <button class="toy" type="button" aria-label="Raf" style="--d:-1.1s;--bt:6.3s"><img src="assets/cast/raf.png" alt=""><img class="b" src="assets/cast/raf_blink.png" alt=""></button>
        <button class="toy" type="button" aria-label="A resident" style="--d:-2.0s;--bt:4.7s"><img src="assets/cast/c3.png" alt=""><img class="b" src="assets/cast/c3_blink.png" alt=""></button>
        <button class="toy agent" type="button" aria-label="A calibrated AI agent" style="--d:-.6s;--bt:3.9s"><img src="assets/cast/agent.png" alt=""><img class="b" src="assets/cast/agent_blink.png" alt=""></button>
        <button class="toy" type="button" aria-label="Priya" style="--d:-1.6s;--bt:5.7s"><img src="assets/cast/priya.png" alt=""><img class="b" src="assets/cast/priya_blink.png" alt=""></button>
        <button class="toy" type="button" aria-label="A resident" style="--d:-2.6s;--bt:6.9s"><img src="assets/cast/c1.png" alt=""><img class="b" src="assets/cast/c1_blink.png" alt=""></button>
        <button class="toy" type="button" aria-label="A resident" style="--d:-.9s;--bt:4.4s"><img src="assets/cast/c2.png" alt=""><img class="b" src="assets/cast/c2_blink.png" alt=""></button>
      </div>
      <div class="plank"></div>
      <div class="plank-front"></div>
    </div>
    <div class="floor"></div>
  </div>
</div>

<main>
  <div class="inner">
    <div class="award">
      <svg viewBox="0 0 84 104" role="img" aria-label="Award rosette">
        <path d="M24 60 L14 102 L30 92 L38 104 L44 66 Z" fill="#d64a3a"/>
        <path d="M60 60 L70 102 L54 92 L46 104 L40 66 Z" fill="#3d7fb3"/>
        <g transform="translate(42 40)">
          <path d="M0 -38 L9 -30 L21 -32 L25 -21 L36 -15 L32 -3 L38 8 L28 16 L27 28 L15 29 L7 38 L-3 32 L-14 36 L-19 25 L-31 21 L-29 9 L-37 0 L-29 -9 L-31 -21 L-19 -25 L-14 -36 L-3 -32 Z" fill="#e8b23a"/>
          <circle r="24" fill="#f6d27a"/>
          <circle r="24" fill="none" stroke="#b9861d" stroke-width="2"/>
          <text y="7" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="900" font-size="20" fill="#13243a">CHI</text>
        </g>
      </svg>
      <div>
        <p class="label" style="margin:0">CHI 2026 · Best Paper</p>
        <a class="title display" href="https://arxiv.org/abs/2509.13588">CoBRA: Programming Cognitive Bias in Social Agents Using Classic Social Science Experiments</a>
      </div>
    </div>

    <div class="film">
      <video controls playsinline preload="metadata" poster="assets/film-poster.jpg" aria-label="The YAX film">
        <source src="assets/yax-film.mp4" type="video/mp4">
      </video>
    </div>

    <footer id="contact">
      <div class="founders"><small>Co-founders</small>Xuan Liu · Haoyang Shang</div>
      <div class="mail">
        <a class="addr" id="addr" href="mailto:xul049@ucsd.edu">xul049@ucsd.edu</a>
        <button class="copy" type="button" id="copy">Copy</button>
      </div>
      <p class="fine">© 2026 YAX</p>
    </footer>
  </div>
</main>

<script>
(()=>{
  const btn=document.getElementById('copy'),addr=document.getElementById('addr');
  btn.addEventListener('click',()=>{
    const done=()=>{btn.textContent='Copied';setTimeout(()=>{btn.textContent='Copy';},1800);};
    const sel=()=>{const r=document.createRange();r.selectNodeContents(addr);const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='Press Ctrl+C';};
    try{navigator.clipboard.writeText('xul049@ucsd.edu').then(done,sel);}catch(e){sel();}
  });
  // a toy hops when clicked or tapped
  document.querySelectorAll('.toy').forEach(t=>t.addEventListener('click',()=>{t.style.animation='none';void t.offsetWidth;t.style.animation='hop .55s cubic-bezier(.3,1.6,.5,1)';setTimeout(()=>{t.style.animation='';},600);}));
})();
</script>

</body>
</html>
