<title>SocietaBox Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#e9ece4; --surface:#f7f8f3; --surface-2:#eff2ea; --ink:#1e2521; --muted:#5b665e; --line:#d2d8cb;
  --accent:#2d6a8f; --accent-soft:#d6e5ee; --talk:#b7791f; --talk-soft:#f6e7c8; --walk:#2d6a8f; --away:#7a847c;
  --busy:#3f7d4c; --frame:#2a231c; --bubble:#fffdf7; --bubble-ink:#1e2521;
  --display:"Pixelify Sans", "Courier New", monospace;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141915; --surface:#1c231e; --surface-2:#222a24; --ink:#e6ebe3; --muted:#9aa69c; --line:#2f3a32;
    --accent:#72b2d8; --accent-soft:#1f3645; --talk:#e0a849; --talk-soft:#3a2f1a; --walk:#72b2d8; --away:#8a948c;
    --busy:#7cc28a; --frame:#0d0b09; --bubble:#fffdf7; --bubble-ink:#1e2521;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141915; --surface:#1c231e; --surface-2:#222a24; --ink:#e6ebe3; --muted:#9aa69c; --line:#2f3a32;
  --accent:#72b2d8; --accent-soft:#1f3645; --talk:#e0a849; --talk-soft:#3a2f1a; --walk:#72b2d8; --away:#8a948c;
  --busy:#7cc28a; --frame:#0d0b09; --bubble:#fffdf7; --bubble-ink:#1e2521;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:14px 32px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:700;font-size:26px;margin:0;letter-spacing:.5px}
.brand p{margin:0;color:var(--muted);font-size:13px}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clock{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:168px;text-align:center}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button,.btn{font:500 13px var(--body);color:var(--ink);background:transparent;border:0;padding:6px 11px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.btn{border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.btn:hover,.seg button:hover{background:var(--surface-2)}
.seg button[aria-pressed="true"]:hover{background:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media (max-width:960px){main.grid{grid-template-columns:minmax(0,1fr)}}
.world{display:flex;flex-direction:column;gap:10px}
.scenebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:600 13px var(--body);padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .count{font:500 11px var(--mono);opacity:.75}
.follow{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer}
.stage{position:relative;background:var(--frame);border-radius:8px;padding:8px;box-shadow:0 1px 0 var(--line)}
.stage-inner{position:relative}
canvas#world{display:block;width:100%;height:auto;aspect-ratio:32/20;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;border-radius:3px}
.overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag[hidden]{display:none}
.tag{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:3px;will-change:left,top}
.bubble{background:var(--bubble);color:var(--bubble-ink);border:2px solid #2b2230;border-radius:6px;padding:3px 7px;font:500 12px/1.3 var(--body);max-width:210px;text-align:left;box-shadow:2px 2px 0 rgba(0,0,0,.25);position:relative}
.bubble.emoji{font-size:15px;padding:1px 6px;line-height:1.35}
.bubble.say{min-width:90px}
.bubble.think{font-style:italic;border-style:dashed}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:5px solid transparent;border-top-color:#2b2230}
.name{font:700 11px var(--display);letter-spacing:.4px;background:rgba(20,16,12,.78);color:#fff;padding:1px 6px;border-radius:3px;white-space:nowrap}
.tag.sel .name{background:var(--accent);color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.feed{padding:12px 14px}
.feed h2,.panel h2{font:700 15px var(--display);letter-spacing:.4px;margin:0 0 8px}
.feed ol{list-style:none;margin:0;padding:0;max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.feed li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;font-size:13px}
.feed time,.mem time,.plan time{font:400 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.feed li.say b{color:var(--talk)}
.panel{display:flex;flex-direction:column;gap:14px}
.residents{padding:12px;display:flex;flex-direction:column;gap:6px}
.res{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:6px;border:1px solid transparent;background:transparent;color:inherit;text-align:left;cursor:pointer;font:inherit;width:100%}
.res:hover{background:var(--surface-2)}
.res[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.res canvas{width:44px;height:44px;image-rendering:pixelated;background:var(--surface-2);border-radius:6px}
.res .who{font-weight:600}
.res .doing{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font:500 11px var(--mono);padding:2px 7px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.chip.Talking{color:var(--talk);background:var(--talk-soft)}
.chip.Walking{color:var(--walk)}
.chip.Busy{color:var(--busy)}
.chip.Away{color:var(--away)}
.detail{padding:14px;display:flex;flex-direction:column;gap:12px}
.detail .head{display:flex;gap:12px;align-items:center}
.detail .head canvas{width:64px;height:64px;image-rendering:pixelated;background:var(--surface-2);border-radius:8px}
.detail h3{font:700 22px var(--display);margin:0;letter-spacing:.4px}
.detail .sub{color:var(--muted);font-size:13px}
.detail .bio{margin:0;font-size:13.5px}
.traits{display:flex;gap:6px;flex-wrap:wrap}
.traits span{font-size:12px;padding:2px 8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.now{font-size:13px;padding:8px 10px;border-radius:6px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px}
.now .lbl,.sec-lbl{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.subtabs button{font:600 13px var(--body);background:none;border:0;border-bottom:2px solid transparent;padding:6px 8px;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.plan,.mem{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:250px;overflow:auto}
.plan li{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;padding:5px 6px;border-radius:4px;font-size:13px}
.plan li.cur{background:var(--accent-soft)}
.plan li.done{color:var(--muted)}
.mem li{display:grid;grid-template-columns:64px minmax(0,1fr) 34px;gap:8px;padding:5px 6px;font-size:13px;border-bottom:1px solid var(--line)}
.mem .imp{font:500 11px var(--mono);color:var(--muted);text-align:right}
.mem li.hi .imp{color:var(--talk);font-weight:600}
form.whisper{display:flex;flex-direction:column;gap:6px}
form.whisper .row{display:flex;gap:6px}
form.whisper input{flex:1;min-width:0;font:14px var(--body);padding:7px 9px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
form.whisper button{background:var(--accent);color:#fff;border-color:var(--accent)}
form.whisper small{color:var(--muted);font-size:12px}
@media (prefers-reduced-motion: reduce){ .tag{transition:none} }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>SocietaBox</h1>
      <p>A small town of generative agents: three residents, two places, one day on loop.</p>
    </div>
    <div class="controls">
      <div class="clock" id="clock" aria-live="off">Day 1 · 8:10 AM</div>
      <button class="btn" id="pause" type="button">Pause</button>
      <div class="seg" role="group" aria-label="Simulation speed" id="speed">
        <button type="button" data-s="1" aria-pressed="false">1×</button>
        <button type="button" data-s="2" aria-pressed="true">2×</button>
        <button type="button" data-s="5" aria-pressed="false">5×</button>
        <button type="button" data-s="12" aria-pressed="false">12×</button>
      </div>
    </div>
  </header>

  <main class="grid">
    <section class="world">
      <div class="scenebar">
        <div class="tabs" role="tablist" aria-label="Places">
          <button class="tab" role="tab" id="tab-town" data-scene="town" aria-selected="true">Maple Square <span class="count" id="count-town"></span></button>
          <button class="tab" role="tab" id="tab-cafe" data-scene="cafe" aria-selected="false">Juniper Café <span class="count" id="count-cafe"></span></button>
        </div>
        <label class="follow"><input type="checkbox" id="follow"> Follow selected resident</label>
      </div>
      <div class="stage">
        <div class="stage-inner">
          <canvas id="world" width="512" height="320" aria-label="Pixel-art view of the town"></canvas>
          <div class="overlay" id="overlay"></div>
        </div>
      </div>
      <div class="card feed">
        <h2>Town log</h2>
        <ol id="feed" aria-live="polite"></ol>
      </div>
    </section>

    <aside class="panel">
      <div class="card residents" id="residents"></div>
      <div class="card detail" id="detail">
        <div class="head"><canvas id="d-avatar" width="16" height="16"></canvas>
          <div><h3 id="d-name"></h3><div class="sub" id="d-sub"></div></div></div>
        <p class="bio" id="d-bio"></p>
        <div class="traits" id="d-traits"></div>
        <div class="now"><span class="lbl">Right now</span><span id="d-now"></span><span class="sub" id="d-where"></span></div>
        <div>
          <div class="subtabs" role="tablist">
            <button type="button" role="tab" id="st-plan" aria-selected="true">Daily plan</button>
            <button type="button" role="tab" id="st-mem" aria-selected="false">Memory stream</button>
          </div>
          <ul class="plan" id="d-plan"></ul>
          <ul class="mem" id="d-mem" hidden></ul>
        </div>
        <form class="whisper" id="whisper">
          <span class="sec-lbl">Whisper an idea</span>
          <div class="row"><input id="whisper-input" type="text" maxlength="90" placeholder="e.g. the café is hosting a hackathon tonight" autocomplete="off"><button class="btn" type="submit">Whisper</button></div>
          <small>It goes into their memory. They will bring it up in their next conversation.</small>
        </form>
      </div>
    </aside>
  </main>
</div>

<script>
(()=>{
const T=16, W=32, H=20;

/* ---------- helpers ---------- */
function rng(x,y,s=0){let n=(x*374761393+y*668265263+s*1442695041)|0;n=Math.imul(n^(n>>>13),1274126177);n^=n>>>16;return (n>>>0)/4294967296;}
function R(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h);}
function disc(c,cx,cy,r,col){c.fillStyle=col;for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)if(dx*dx+dy*dy<=r*r+r*.6)c.fillRect(cx+dx,cy+dy,1,1);}
function mk(w=W*T,h=H*T){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function grid(ch){return Array.from({length:H},()=>Array(W).fill(ch));}
function rect(g,x0,y0,x1,y1,ch){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)g[y][x]=ch;}
const pad=s=>s.padEnd(16,'.');
function fmt(t){t=((t%1440)+1440)%1440;let h=Math.floor(t/60),m=Math.floor(t%60);const ap=h<12?'AM':'PM';h=h%12||12;return `${h}:${String(m).padStart(2,'0')} ${ap}`;}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}

/* ---------- maps ---------- */
const BUILD=[{x0:2,x1:11,roof:'#b4533c',roofD:'#8b3b2a',wall:'#ecd9b4'},{x0:19,x1:24,roof:'#4f6a9e',roofD:'#3a4f78',wall:'#eee4cf'},{x0:26,x1:30,roof:'#5f8a4a',roofD:'#466a36',wall:'#efe6d2'}];
function buildTown(){
  const g=grid('G');
  for(let x=0;x<W;x++){g[0][x]='T';g[H-1][x]='T';}
  for(let y=0;y<H;y++){g[y][0]='T';g[y][W-1]='T';}
  rect(g,2,14,5,15,'F');rect(g,9,16,11,17,'F');rect(g,26,17,28,17,'F');
  for(const b of BUILD){rect(g,b.x0,1,b.x1,2,'R');rect(g,b.x0,3,b.x1,4,'B');}
  [[3,3],[4,3],[3,4],[4,4],[8,3],[9,3],[10,3],[8,4],[9,4],[10,4],[20,3],[23,3],[27,3],[29,3]].forEach(([x,y])=>g[y][x]='N');
  g[4][6]='D';g[4][21]='D';g[4][28]='D';
  for(let x=0;x<=30;x++)g[6][x]='P';
  g[5][6]='P';g[5][21]='P';g[5][28]='P';
  for(let y=7;y<=18;y++)g[y][15]='P';
  for(let x=4;x<=14;x++)g[12][x]='P';
  for(let y=8;y<=18;y++)for(let x=17;x<=30;x++){const dx=(x+.5-24.5)/5,dy=(y+.5-13)/3.2;if(dx*dx+dy*dy<1)g[y][x]='W';}
  [[2,8],[8,8],[12,9],[3,17],[7,17],[13,15],[27,8],[30,10],[29,17],[21,18],[17,17],[1,11]].forEach(([x,y])=>g[y][x]='T');
  g[11][6]='S';g[11][10]='S';g[13][18]='S';
  g[9][18]='E';g[7][14]='L';g[7][16]='L';g[5][1]='I';
  return g;
}
const CX=5, CY=2;
function buildCafe(){
  const g=grid('V');
  rect(g,5,2,26,17,'f');
  rect(g,5,2,26,3,'w');
  for(let y=2;y<=17;y++){g[y][5]='w';g[y][26]='w';}
  for(let x=5;x<=26;x++)g[17][x]='w';
  g[17][16]='d';
  rect(g,17,2,19,3,'x');rect(g,22,2,24,3,'x');rect(g,9,2,11,3,'M');
  rect(g,7,4,13,4,'k');rect(g,7,7,13,7,'c');g[7][8]='m';g[7][12]='q';g[7][13]='q';
  rect(g,7,11,13,14,'r');
  [[18,6],[23,6],[18,11],[23,11]].forEach(([x,y])=>{g[y][x]='a';g[y][x-1]='h';g[y][x+1]='h';});
  g[12][6]='b';g[13][6]='b';g[14][6]='b';
  g[4][25]='l';g[16][25]='l';g[16][6]='l';
  return g;
}
const WALK={town:new Set(['G','P','F','D','S']),cafe:new Set(['f','d','r','h'])};
const SEAT=new Set(['S','h']);
const SCENES={town:{id:'town',name:'Maple Square',g:buildTown()},cafe:{id:'cafe',name:'Juniper Café',g:buildCafe()}};

/* ---------- tile art ---------- */
function grass(c,x,y){const X=x*T,Y=y*T;R(c,X,Y,T,T,'#86b85f');for(let i=0;i<7;i++){const a=rng(x,y,i),b=rng(x,y,i+20);R(c,X+(a*15|0),Y+(b*15|0),1,1,i%2?'#74a553':'#9dcc72');}if(rng(x,y,99)<.35){const a=(rng(x,y,98)*12|0)+2,b=(rng(x,y,97)*10|0)+3;R(c,X+a,Y+b,1,2,'#6a9c4b');R(c,X+a+2,Y+b,1,2,'#6a9c4b');R(c,X+a+1,Y+b-1,1,3,'#6a9c4b');}}
function path(c,x,y){const X=x*T,Y=y*T;R(c,X,Y,T,T,'#d8c08e');for(let i=0;i<6;i++){R(c,X+(rng(x,y,i)*15|0),Y+(rng(x,y,i+9)*15|0),1,1,i%2?'#c5a974':'#e6d4aa');}}
function drawTree(c,x,y){const X=x*T,Y=y*T;R(c,X+4,Y+13,9,3,'rgba(0,0,0,.18)');R(c,X+6,Y+7,4,8,'#7a5230');R(c,X+6,Y+7,1,8,'#634126');disc(c,X+8,Y+2,7,'#2f6a33');disc(c,X+8,Y+1,6,'#3e7d3a');disc(c,X+6,Y-1,3,'#56994a');R(c,X+5,Y-3,2,1,'#6fae5a');}
const FONT={C:['111','100','100','100','111'],A:['010','101','111','101','101'],F:['111','100','110','100','100'],E:['111','100','110','100','111']};
function ptext(c,s,X,Y,col){[...s].forEach((ch,i)=>FONT[ch].forEach((row,ry)=>[...row].forEach((b,rx)=>{if(b==='1')R(c,X+i*4+rx,Y+ry,1,1,col);})));}

function renderTown(){
  const cv=mk(),c=cv.getContext('2d'),g=SCENES.town.g;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const t=g[y][x],X=x*T,Y=y*T,b=BUILD.find(b=>x>=b.x0&&x<=b.x1);
    if(t==='P'){path(c,x,y);continue;}
    if(t==='W'){R(c,X,Y,T,T,'#4d93c0');const nb=(dx,dy)=>g[y+dy]&&g[y+dy][x+dx]==='W';
      if(!nb(0,-1)){R(c,X,Y,T,2,'#d8c08e');R(c,X,Y+2,T,1,'#3a769e');}
      if(!nb(0,1)){R(c,X,Y+14,T,2,'#d8c08e');R(c,X,Y+13,T,1,'#3a769e');}
      if(!nb(-1,0)){R(c,X,Y,2,T,'#d8c08e');R(c,X+2,Y,1,T,'#3a769e');}
      if(!nb(1,0)){R(c,X+14,Y,2,T,'#d8c08e');R(c,X+13,Y,1,T,'#3a769e');}
      if(rng(x,y,5)<.5)R(c,X+4+(rng(x,y,6)*6|0),Y+5+(rng(x,y,7)*6|0),4,1,'#79b6dc');continue;}
    if(t==='R'){R(c,X,Y,T,T,b.roof);for(let r=0;r<4;r++){R(c,X,Y+r*4+3,T,1,b.roofD);R(c,X+((r+x)%2?4:12),Y+r*4,1,3,b.roofD);}
      if(y===1)R(c,X,Y,T,2,'#00000022');if(y===2){R(c,X,Y+13,T,3,b.roofD);R(c,X,Y+15,T,1,'#2b2230');}continue;}
    if(t==='B'||t==='N'||t==='D'){R(c,X,Y,T,T,b.wall);
      if(b.x0===2){for(let r=0;r<4;r++)for(let k=0;k<3;k++)R(c,X+((r%2)*3+k*6)%16,Y+r*4+1,5,3,rng(x,y,r*3+k)<.5?'#d9c29a':'#e3cda6');}
      else for(let r=1;r<4;r++)R(c,X,Y+r*4,T,1,'#d7ccb5');

function bfs(sc,sx,sy,gx,gy){
  const g=SCENES[sc].g,ok=WALK[sc];if(sx===gx&&sy===gy)return[];
  const prev=new Map(),k=(x,y)=>y*W+x,q=[[sx,sy]];prev.set(k(sx,sy),null);
  while(q.length){const[x,y]=q.shift();if(x===gx&&y===gy)break;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const kk=k(nx,ny);if(prev.has(kk))continue;
      if(!ok.has(g[ny][nx])&&!(nx===gx&&ny===gy))continue;prev.set(kk,k(x,y));q.push([nx,ny]);}}
  if(!prev.has(k(gx,gy)))return null;
  const out=[];let cur=k(gx,gy);while(cur!==k(sx,sy)){out.push({x:cur%W,y:Math.floor(cur/W)});cur=prev.get(cur);}return out.reverse();
}

let sim=8*60+10,speed=2,paused=false,view='town',selected='mei',follow=false,convo=null;
const cooldown={},convoCount={};
const feed=[];
const agents=AGENTS_DEF.map(d=>({...d,x:0,y:0,tx:0,ty:0,dir:'down',scene:'off',offAt:d.home,path:[],hop:null,goalKey:null,settled:true,blockIdx:-1,sub:null,walkT:0,convo:null,thought:null,whisper:null,
  memories:d.mem.map(([t,i])=>({t:sim-60*(3+Math.random()*20),text:t,imp:i}))}));
const byId=Object.fromEntries(agents.map(a=>[a.id,a]));
function tod(){return ((sim%1440)+1440)%1440;}
function blockIndex(a){const t=tod();let i=0;a.plan.forEach((b,k)=>{if(b.s<=t)i=k;});return i;}
function addMem(a,text,imp){a.memories.push({t:sim,text,imp});if(a.memories.length>60)a.memories.shift();}
function log(text,cls){feed.push({t:sim,text,cls});if(feed.length>80)feed.shift();feedDirty=true;}
let feedDirty=true;

function placeAt(a,key){const p=PLACES[key];a.goalKey=key;a.settled=true;a.hop=null;a.path=[];
  if(p.off){a.scene='off';a.offAt=key;}else{a.scene=p.scene;a.x=a.tx=p.x;a.y=a.ty=p.y;a.dir=p.face||'down';}}
agents.forEach(a=>{a.blockIdx=blockIndex(a);placeAt(a,a.plan[a.blockIdx].place);});

function setGoal(a,key){a.goalKey=key;a.settled=false;planHop(a);}
function planHop(a){
  const pl=PLACES[a.goalKey];
  if(a.scene==='off'){if(a.offAt===a.goalKey){a.settled=true;return;}const e=PLACES[a.offAt].entry;a.scene=e.scene;a.x=a.tx=e.x;a.y=a.ty=e.y;log(`${a.name.split(' ')[0]} left ${PLACES[a.offAt].label}.`);}
  const ts=pl.off?pl.entry.scene:pl.scene,dst=pl.off?pl.entry:pl;
  let hop;if(a.scene===ts)hop={x:dst.x,y:dst.y};else{const p=PORTALS.find(p=>p.scene===a.scene&&p.to.scene===ts);hop={x:p.x,y:p.y,portal:p};}
  a.hop=hop;a.path=bfs(a.scene,a.tx,a.ty,hop.x,hop.y)||[];
}
function arrive(a){
  const h=a.hop;a.hop=null;
  if(h.portal){a.scene=h.portal.to.scene;a.x=a.tx=h.portal.to.x;a.y=a.ty=h.portal.to.y;
    log(`${a.name.split(' ')[0]} ${a.scene==='cafe'?'walked into Juniper Café':'stepped out onto Maple Square'}.`);planHop(a);return;}
  const pl=PLACES[a.goalKey];
  if(pl.off){a.scene='off';a.offAt=a.goalKey;log(`${a.name.split(' ')[0]} went to ${pl.label}.`);}
  else a.dir=pl.face||a.dir;
  a.settled=true;
}
function updateAgent(a,dt){
  if(a.convo)return;
  const bi=blockIndex(a);
  if(bi!==a.blockIdx){a.blockIdx=bi;a.sub=null;const b=a.plan[bi];addMem(a,`Started: ${b.act.toLowerCase()}`,2);setGoal(a,b.place);}
  if(a.sub&&a.settled&&sim>=a.sub.until){a.sub=null;setGoal(a,a.plan[a.blockIdx].place);}
  if(a.settled||!a.hop)return;
  if(!a.path.length){arrive(a);return;}
  const n=a.path[0],sp=3.2*Math.pow(speed,.7)*dt,dx=n.x-a.x,dy=n.y-a.y,d=Math.hypot(dx,dy);
  if(Math.abs(dx)>Math.abs(dy))a.dir=dx>0?'right':'left';else if(dy)a.dir=dy>0?'down':'up';
  a.walkT+=dt;
  if(d<=sp){a.x=a.tx=n.x;a.y=a.ty=n.y;a.path.shift();if(!a.path.length)arrive(a);}else{a.x+=dx/d*sp;a.y+=dy/d*sp;}
}
function onMinute(){
  for(const a of agents){const b=a.plan[a.blockIdx];
    if(b.wander&&a.settled&&!a.sub&&!a.convo&&a.goalKey===b.place&&Math.random()<.05){const w=b.wander[Math.random()*b.wander.length|0];a.sub={until:sim+6+Math.random()*10,act:PLACES[w].act};setGoal(a,w);}}
  if(convo)return;
  for(let i=0;i<agents.length;i++)for(let j=i+1;j<agents.length;j++){
    const a=agents[i],b=agents[j];if(a.scene==='off'||a.scene!==b.scene||!a.settled||!b.settled)continue;
    const key=[a.id,b.id].sort().join('|');if((cooldown[key]||-1e9)>sim)continue;
    if(Math.hypot(a.x-b.x,a.y-b.y)>(a.scene==='cafe'?8:5))continue;
    if(Math.random()<.3){startConvo(a,b,key);return;}
  }
}
function face(a,b){const dx=b.x-a.x,dy=b.y-a.y;a.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');}
function startConvo(a,b,key){
  const list=SCRIPTS[key],n=convoCount[key]=(convoCount[key]||0);convoCount[key]++;
  const sc=list[n%list.length];let lines=sc.lines.map(([w,t])=>({who:byId[w],text:t}));
  for(const x of[a,b])if(x.whisper){const o=x===a?b:a;lines.splice(1,0,{who:x,text:`By the way, ${x.whisper}`},{who:o,text:REPLIES[Math.random()*REPLIES.length|0]});addMem(o,`${x.name.split(' ')[0]} mentioned: "${x.whisper}"`,6);x.whisper=null;}
  convo={a,b,lines,i:0,t:0,topic:sc.topic,key};a.convo=b.convo=convo;
  const sitA=SEAT.has(SCENES[a.scene].g[a.ty][a.tx]),sitB=SEAT.has(SCENES[b.scene].g[b.ty][b.tx]);
  if(!sitA)face(a,b);if(!sitB)face(b,a);
  log(`${a.name.split(' ')[0]} and ${b.name.split(' ')[0]} started talking about ${sc.topic}.`,'ev');
  sayLine();
}
function sayLine(){const l=convo.lines[convo.i];log(`${l.who.name.split(' ')[0]}: ${l.text}`,'say');}
function updateConvo(dt){
  if(!convo)return;convo.t+=dt;
  if(convo.t>=Math.max(1.8,3.6/Math.sqrt(speed))){convo.t=0;convo.i++;
    if(convo.i>=convo.lines.length){const{a,b,topic,key}=convo;
      addMem(a,`Talked with ${b.name.split(' ')[0]} about ${topic}`,5);addMem(b,`Talked with ${a.name.split(' ')[0]} about ${topic}`,5);
      cooldown[key]=sim+100;a.convo=b.convo=null;convo=null;if(a.sub)a.sub.until=sim;const pa=PLACES[a.goalKey],pb=PLACES[b.goalKey];if(a.settled&&pa.face)a.dir=pa.face;if(b.settled&&pb.face)b.dir=pb.face;return;}
    sayLine();}
}

/* ---------- rendering ---------- */
const cv=document.getElementById('world'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
function darkness(t){const h=t/60;if(h<5)return .58;if(h<7)return .58*(7-h)/2;if(h<18)return 0;if(h<21)return .58*(h-18)/3;return .58;}
function draw(time){
  ctx.drawImage(BG[view],0,0);
  if(view==='town'){const b=Math.floor(time*2.5);for(const[x,y]of WATER){if(rng(x,y,b)<.22)R(ctx,x*T+3+(rng(x,y,b+1)*8|0),y*T+4+(rng(x,y,b+2)*8|0),3,1,'#a8d6f0');}}
  const vis=agents.filter(a=>a.scene===view).sort((p,q)=>p.y-q.y);
  for(const a of vis){
    const sit=a.settled&&SEAT.has(SCENES[a.scene].g[a.ty][a.tx]);
    const moving=!a.settled&&!a.convo;const fr=moving?['A','B','A','C'][Math.floor(a.walkT*8)%4]:'A';
    const X=Math.round(a.x*T),Y=Math.round(a.y*T)-3+(sit?3:0)-(fr!=='A'?1:0);
    if(a.id===selected){ctx.fillStyle='rgba(114,178,216,.55)';for(let dx=-6;dx<=6;dx++){const h=Math.round(Math.sqrt(1-(dx/7)**2)*2.5);ctx.fillRect(X+8+dx,Y+16+(sit?-2:0)-h+1,1,h*2);}}
    else R(ctx,X+4,Y+15+(sit?-2:0),8,2,'rgba(0,0,0,.2)');
    const sp=sprite(a,a.dir,fr);
    if(sit)ctx.drawImage(sp,0,0,16,13,X,Y,16,13);else ctx.drawImage(sp,X,Y);
  }
  const d=darkness(tod())*(view==='cafe'?.3:1);
  if(d>0){ctx.fillStyle=`rgba(16,22,58,${d})`;ctx.fillRect(0,0,cv.width,cv.height);
    if(view==='town'){const g=Math.min(.95,d*1.7);for(const[x,y]of WINDOWS){ctx.fillStyle=`rgba(255,214,130,${g})`;ctx.fillRect(x*T+3,y*T+4,10,9);}
      for(const[x,y]of[[14,7],[16,7]]){const gr=ctx.createRadialGradient(x*T+8,y*T+2,1,x*T+8,y*T+2,26);gr.addColorStop(0,`rgba(255,220,150,${d*.9})`);gr.addColorStop(1,'rgba(255,220,150,0)');ctx.fillStyle=gr;ctx.fillRect(x*T-20,y*T-24,56,56);}}
    else{ctx.fillStyle=`rgba(10,16,48,${darkness(tod())*.8})`;[[17,2],[18,2],[19,2],[22,2],[23,2],[24,2]].forEach(([x,y])=>ctx.fillRect(x*T+1,y*T+4,14,18));}
  }
}

/* ---------- overlay ---------- */
const overlay=document.getElementById('overlay');const tags={};
agents.forEach(a=>{const t=el('div','tag');const b=el('div','bubble emoji');const n=el('div','name',a.name.split(' ')[0]);t.append(b,n);overlay.append(t);tags[a.id]={t,b,n};});
function updateOverlay(){
  const s=cv.clientWidth/cv.width;
  for(const a of agents){const tg=tags[a.id];if(a.scene!==view){tg.t.hidden=true;continue;}tg.t.hidden=false;
    const sit=a.settled&&SEAT.has(SCENES[a.scene].g[a.ty][a.tx]);
    tg.t.style.left=((a.x*T+8)*s)+'px';tg.t.style.top=((a.y*T-3+(sit?3:0))*s)+'px';
    tg.t.classList.toggle('sel',a.id===selected);
    let txt,cls;
    if(a.convo&&a.convo.lines[a.convo.i]&&a.convo.lines[a.convo.i].who===a){txt=a.convo.lines[a.convo.i].text;cls='bubble say';}
    else if(a.convo){txt='💬';cls='bubble emoji';}
    else if(a.thought&&sim<a.thought.until){txt=a.thought.text;cls='bubble think';}
    else if(!a.settled){txt='🚶';cls='bubble emoji';}
    else if(a.sub){txt='🫖';cls='bubble emoji';}
    else{txt=a.plan[a.blockIdx].emo;cls='bubble emoji';}
    if(tg.b.textContent!==txt)tg.b.textContent=txt;if(tg.b.className!==cls)tg.b.className=cls;
  }
}

/* ---------- panel ---------- */
function avatar(a,c){const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.clearRect(0,0,16,16);x.drawImage(sprite(a,'down','A'),0,2,16,14,0,2,16,14);}
const resEl=document.getElementById('residents');const resRows={};
resEl.append(Object.assign(el('h2',null,'Residents'),{style:'font:700 15px var(--display);margin:2px 4px 4px;letter-spacing:.4px'}));
agents.forEach(a=>{const b=el('button','res');b.type='button';const c=mk(16,16);avatar(a,c);const mid=el('div');const who=el('div','who',a.name);const doing=el('div','doing');mid.append(who,doing);const chip=el('span','chip');b.append(c,mid,chip);
  b.addEventListener('click',()=>select(a.id));resEl.append(b);resRows[a.id]={b,doing,chip};});
function status(a){
  if(a.convo){const o=a.convo.a===a?a.convo.b:a.convo.a;return{st:'Talking',text:`Talking with ${o.name.split(' ')[0]} about ${a.convo.topic}`};}
  if(a.scene==='off')return{st:'Away',text:a.plan[a.blockIdx].act};
  if(!a.settled)return{st:'Walking',text:`Walking to ${PLACES[a.goalKey].label}`};
  if(a.sub)return{st:'Busy',text:a.sub.act};
  return{st:'Busy',text:a.plan[a.blockIdx].act};
}
function where(a){if(a.scene==='off')return PLACES[a.offAt].label;const sc=SCENES[a.scene].name;return a.settled&&PLACES[a.goalKey]&&!PLACES[a.goalKey].off?`${sc} · ${PLACES[a.goalKey].label}`:sc;}
let memTab=false,lastMemLen=-1,lastSel=null;
const $=id=>document.getElementById(id);
function select(id){selected=id;lastMemLen=-1;renderDetail(true);if(follow)followNow();}
function renderDetail(full){
  const a=byId[selected];
  if(full||lastSel!==selected){lastSel=selected;avatar(a,$('d-avatar'));$('d-name').textContent=a.name;$('d-sub').textContent=`${a.age} · ${a.role}`;$('d-bio').textContent=a.bio;
    const tr=$('d-traits');tr.replaceChildren(...a.traits.map(t=>el('span',null,t)));
    $('whisper-input').placeholder=`Tell ${a.name.split(' ')[0]} something…`;}
  const s=status(a);$('d-now').textContent=s.text;$('d-where').textContent=where(a);
  const pl=$('d-plan');pl.replaceChildren(...a.plan.map((b,i)=>{const li=el('li',i===a.blockIdx?'cur':i<a.blockIdx?'done':'');li.append(el('time',null,fmt(b.s)),el('span',null,`${b.emo} ${b.act}`));return li;}));
  if(a.memories.length!==lastMemLen){lastMemLen=a.memories.length;const m=$('d-mem');m.replaceChildren(...a.memories.slice().reverse().map(x=>{const li=el('li',x.imp>=6?'hi':'');li.append(el('time',null,fmt(x.t)),el('span',null,x.text),el('span','imp',`★${x.imp}`));return li;}));}
}
function renderPanel(){
  const t=tod();$('clock').textContent=`Day ${Math.floor(sim/1440)+1} · ${fmt(t)}`;
  for(const a of agents){const s=status(a),r=resRows[a.id];r.doing.textContent=s.text;r.chip.textContent=s.st;r.chip.className='chip '+s.st;r.b.setAttribute('aria-pressed',a.id===selected);}
  $('count-town').textContent=agents.filter(a=>a.scene==='town').length+'/3';$('count-cafe').textContent=agents.filter(a=>a.scene==='cafe').length+'/3';
  renderDetail(false);
  if(feedDirty){feedDirty=false;const f=$('feed');f.replaceChildren(...feed.slice().reverse().map(e=>{const li=el('li',e.cls||'');li.append(el('time',null,fmt(e.t)));const sp=el('span');
    if(e.cls==='say'){const i=e.text.indexOf(':');sp.append(el('b',null,e.text.slice(0,i+1)),document.createTextNode(e.text.slice(i+1)));}else sp.textContent=e.text;li.append(sp);return li;}));}
}

/* ---------- controls ---------- */
function setView(v){view=v;document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.scene===v));}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{setView(t.dataset.scene);if(follow){follow=false;$('follow').checked=false;}}));
$('follow').addEventListener('change',e=>{follow=e.target.checked;if(follow)followNow();});
function followNow(){const a=byId[selected];if(a.scene!=='off'&&a.scene!==view)setView(a.scene);}
$('pause').addEventListener('click',()=>{paused=!paused;$('pause').textContent=paused?'Resume':'Pause';});
document.querySelectorAll('#speed button').forEach(b=>b.addEventListener('click',()=>{speed=+b.dataset.s;document.querySelectorAll('#speed button').forEach(x=>x.setAttribute('aria-pressed',x===b));}));
$('st-plan').addEventListener('click',()=>{memTab=false;$('d-plan').hidden=false;$('d-mem').hidden=true;$('st-plan').setAttribute('aria-selected','true');$('st-mem').setAttribute('aria-selected','false');});
$('st-mem').addEventListener('click',()=>{memTab=true;$('d-plan').hidden=true;$('d-mem').hidden=false;$('st-plan').setAttribute('aria-selected','false');$('st-mem').setAttribute('aria-selected','true');});
$('whisper').addEventListener('submit',e=>{e.preventDefault();const inp=$('whisper-input');const v=inp.value.trim();if(!v)return;const a=byId[selected];
  a.whisper=v.replace(/[.!?]+$/,'')+'.';a.thought={text:`Hmm… ${v}`,until:sim+25};addMem(a,`Heard a whisper: "${v}"`,8);log(`You whispered to ${a.name.split(' ')[0]}: "${v}"`,'ev');inp.value='';lastMemLen=-1;});
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),s=cv.width/r.width,mx=(e.clientX-r.left)*s/T,my=(e.clientY-r.top)*s/T;
  let best=null,bd=1.4;for(const a of agents){if(a.scene!==view)continue;const d=Math.hypot(a.x+.5-mx,a.y+.3-my);if(d<bd){bd=d;best=a;}}if(best)select(best.id);});

/* ---------- loop ---------- */
log('Day 1 begins. Mei is already behind the counter at Juniper Café.','ev');
renderDetail(true);
let last=performance.now(),acc=0,uiT=0;
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(!paused){const dm=dt*speed;sim+=dm;acc+=dm;while(acc>=1){acc-=1;onMinute();}agents.forEach(a=>updateAgent(a,dt));updateConvo(dt);if(follow)followNow();}
  draw(now/1000);updateOverlay();
  uiT+=dt;if(uiT>.25){uiT=0;renderPanel();}
  requestAnimationFrame(frame);
}
renderPanel();requestAnimationFrame(frame);
})();
</script>
