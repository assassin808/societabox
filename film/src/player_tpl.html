<title>YAX Film</title>
<style>
/*FONTS*/
:root{color-scheme:dark;--bg:#14110d;--ink:#efe6d3;--muted:#a79a86;--line:#3a3128;--accent:#f2c14e}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Caveat",cursive;padding-inline:16px;padding-block:18px 28px;display:flex;flex-direction:column;align-items:center;gap:14px}
.frame{position:relative;width:min(100%,1280px);aspect-ratio:16/9;max-width:100%;border-radius:6px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45);background:#efe6d3}
canvas{width:100%;height:100%;display:block}
.play{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-end;padding:3%;background:linear-gradient(to top,rgba(20,17,13,.35),rgba(20,17,13,0) 45%);border:0;cursor:pointer;color:#fff}
.play span{width:clamp(56px,8vw,96px);height:clamp(56px,8vw,96px);border-radius:50%;background:rgba(214,74,58,.95);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.play svg{margin-left:8%;width:40%;height:auto}
.cap{position:absolute;left:50%;bottom:4.5%;transform:translateX(-50%);max-width:86%;text-align:center;font:600 clamp(14px,2.2vw,26px)/1.25 "Fraunces",Georgia,serif;color:#fbf8f1;background:rgba(31,42,48,.78);padding:.25em .6em;border-radius:4px;pointer-events:none}
.bar{width:min(100%,1280px);display:flex;align-items:center;gap:12px;font:500 15px system-ui,sans-serif;color:var(--muted)}
.bar button{font:600 14px system-ui,sans-serif;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar button:focus-visible,input:focus-visible,.play:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar input{flex:1;min-width:0;accent-color:#d64a3a}
.bar time{font-variant-numeric:tabular-nums;min-width:88px;text-align:right}
.note{width:min(100%,1280px);font:400 13px system-ui,sans-serif;color:var(--muted);margin:0}
</style>
<div class="frame" id="frame">
  <canvas id="c" width="1920" height="1080" aria-label="YAX film"></canvas>
  <div class="cap" id="cap" hidden></div>
  <button class="play" id="big" type="button" aria-label="Play the film with sound"><span><svg width="44" height="50" viewBox="0 0 44 50"><path d="M0 0 L44 25 L0 50 Z" fill="#fff"/></svg></span></button>
</div>
<div class="bar">
  <button type="button" id="pp">Play</button>
  <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Position in film">
  <time id="tm">0:00 / 0:42</time>
  <button type="button" id="cc" aria-pressed="false">Captions</button>
</div>
<p class="note">Narration: Kokoro TTS (open weights). Score and sound design synthesized in code. Every frame is drawn live by JavaScript.</p>
<audio id="au" preload="auto" src="data:audio/mp4;base64,/*AUDIO*/"></audio>
<script>window.YAX_TIMELINE=/*TIMELINE*/;</script>
<script>/*FILMJS*/</script>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),au=document.getElementById('au'),big=document.getElementById('big'),pp=document.getElementById('pp'),sc=document.getElementById('scrub'),tm=document.getElementById('tm'),cc=document.getElementById('cc'),cap=document.getElementById('cap');
const D=YAXFilm.duration,L=YAX_TIMELINE.lines;let playing=false,tLocal=0,last=0,capsOn=false,started=false;
try{capsOn=localStorage.getItem('yax-cc')==='1';}catch(e){}
cc.setAttribute('aria-pressed',capsOn);
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function now(){return playing&&!au.paused&&au.readyState>1?au.currentTime:tLocal;}
function draw(t){YAXFilm.render(ctx,Math.min(D-0.001,Math.max(0,t)));sc.value=Math.round(t/D*1000);tm.textContent=`${fmt(t)} / ${fmt(D)}`;
  const l=L.find(x=>t>=x.start&&t<=x.start+x.dur+0.25);cap.hidden=!(capsOn&&l);if(l&&capsOn&&cap.textContent!==l.text)cap.textContent=l.text;}
function loop(ts){const dt=Math.min(.1,(ts-last)/1000);last=ts;if(playing){if(au.paused||au.readyState<2)tLocal+=dt;else tLocal=au.currentTime;if(tLocal>=D){pause();tLocal=D-0.001;}}draw(started?tLocal:40.9);requestAnimationFrame(loop);}
function play(){if(!started){started=true;tLocal=0;}if(tLocal>=D-0.05)tLocal=0;playing=true;big.hidden=true;pp.textContent='Pause';try{au.currentTime=tLocal;}catch(e){}const p=au.play();if(p&&p.catch)p.catch(()=>{});}
function pause(){playing=false;pp.textContent='Play';au.pause();}
big.addEventListener('click',play);pp.addEventListener('click',()=>playing?pause():play());
sc.addEventListener('input',()=>{started=true;tLocal=sc.value/1000*D;try{au.currentTime=tLocal;}catch(e){}});
cc.addEventListener('click',()=>{capsOn=!capsOn;cc.setAttribute('aria-pressed',capsOn);try{localStorage.setItem('yax-cc',capsOn?'1':'0');}catch(e){}});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();playing?pause():play();}});
Promise.race([/*FONTLOAD*/,new Promise(r=>setTimeout(r,2500))]).then(()=>{YAXFilm.buildTextures();last=performance.now();requestAnimationFrame(t=>{last=t;loop(t);});});
})();
</script>
